<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor MQTT - Riego y Ventilación</title>
  <!-- Librería Paho MQTT vía CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    /* ---- Reset y variables ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.1);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #3b82f6;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    html { font-family: 'Inter', sans-serif; color: var(--text-primary); }
    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ---- Contenedor principal ---- */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header h1 i { color: var(--accent); margin-right: 8px; }

    /* ---- Indicador de conexión ---- */
    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      transition: background 0.3s;
    }
    .connection-status .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .connection-status .dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .connection-status .dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    /* ---- Botón de simulación ---- */
    .sim-toggle {
      margin-top: 12px;
      padding: 8px 20px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sim-toggle:active { transform: scale(0.96); }
    .sim-toggle.off { background: #334155; color: #94a3b8; }
    .sim-toggle.on { background: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.5); }

    /* ---- Grid de tarjetas ---- */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    /* ---- Tarjeta (card) ---- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card .value {
      font-size: 2.4rem;
      font-weight: 700;
    }
    .card .value .unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    /* ---- Estado de motores ---- */
    .motor-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .motor-status i {
      font-size: 2rem;
      transition: color 0.3s;
    }
    .motor-status .state-text {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .motor-status .state-text.on { color: var(--green); }
    .motor-status .state-text.off { color: var(--red); }

    /* ---- Sección de gráfica ---- */
    .chart-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    .chart-section h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-section h2 i { color: var(--accent); }
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-height: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1><i class="fas fa-microchip"></i>Monitor de Riego</h1>
      <div class="connection-status" id="connectionStatus">
        <span class="dot disconnected" id="connectionDot"></span>
        <span id="connectionText">Desconectado</span>
      </div>
      <button class="sim-toggle off" id="simBtn"><i class="fas fa-play"></i> Simular ESP</button>
    </header>

    <!-- Grid de tarjetas -->
    <div class="cards-grid">
      <!-- Humedad -->
      <div class="card">
        <div class="label"><i class="fas fa-tint"></i>Humedad</div>
        <div class="value" id="humidityValue">--<span class="unit">%</span></div>
      </div>

      <!-- Humedad de suelo -->
      <div class="card">
        <div class="label"><i class="fas fa-seedling"></i>Humedad de Suelo</div>
        <div class="value" id="soilHumidityValue">--<span class="unit">%</span></div>
      </div>

      <!-- Temperatura -->
      <div class="card">
        <div class="label"><i class="fas fa-thermometer-half"></i>Temperatura</div>
        <div class="value" id="temperatureValue">--<span class="unit">°C</span></div>
      </div>

      <!-- Luminosidad (LDR) -->
      <div class="card">
        <div class="label"><i class="fas fa-sun"></i>Luminosidad</div>
        <div class="motor-status">
          <i class="fas fa-sun" id="luzIcon" style="color: #f59e0b;"></i>
          <span class="state-text" id="luzText">---</span>
        </div>
      </div>

      <!-- Motor de ventilación -->
      <div class="card">
        <div class="label"><i class="fas fa-fan"></i>Motor de Ventilación</div>
        <div class="motor-status">
          <i class="fas fa-fan" id="ventIcon" style="color: var(--red);"></i>
          <span class="state-text off" id="ventText">Desactivado</span>
        </div>
      </div>

      <!-- Motor sumergido (bomba de agua) -->
      <div class="card">
        <div class="label"><i class="fas fa-water"></i>Motor Sumergido</div>
        <div class="motor-status">
          <i class="fas fa-water" id="sumpIcon" style="color: var(--red);"></i>
          <span class="state-text off" id="sumpText">Desactivado</span>
        </div>
      </div>

    </div>

    <!-- Sección de gráfica histórica -->
    <div class="chart-section">
      <h2><i class="fas fa-chart-line"></i>Histórico de Sensores</h2>
      <div class="chart-wrapper">
        <canvas id="sensorChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // ---- Simulador (se registra primero, no depende de nada) ----
    let simInterval = null;
    document.getElementById("simBtn").addEventListener("click", () => {
      const btn = document.getElementById("simBtn");
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        btn.className = "sim-toggle off";
        btn.innerHTML = '<i class="fas fa-play"></i> Simular ESP';
      } else {
        simularDatos();
        simInterval = setInterval(simularDatos, 3000);
        btn.className = "sim-toggle on";
        btn.innerHTML = '<i class="fas fa-stop"></i> Detener simulación';
      }
    });

    // ---- Configuración MQTT (HiveMQ Cloud) ----
    const MQTT_HOST = "aadfec39d82e4788bfbebcbf3bfde060.s1.eu.hivemq.cloud";
    const MQTT_PORT = 8884;
    const MQTT_USER = "INVERNADERO_WEB";
    const MQTT_PASS = "Invernadero123*";
    const CLIENT_ID = "web_dashboard_" + Math.random().toString(36).substring(2, 10);
    const TOPICS = [
      "invernadero/humedad_amb",
      "invernadero/temperatura",
      "invernadero/ventilador",
      "invernadero/bomba",
      "invernadero/bombilla",
      "invernadero/humedad_suelo"
    ];

    // ---- Elementos del DOM ----
    const connDot = document.getElementById("connectionDot");
    const connText = document.getElementById("connectionText");
    const humidityEl = document.getElementById("humidityValue");
    const temperatureEl = document.getElementById("temperatureValue");
    const ventIcon = document.getElementById("ventIcon");
    const ventText = document.getElementById("ventText");
    const sumpIcon = document.getElementById("sumpIcon");
    const sumpText = document.getElementById("sumpText");
    const luzIcon = document.getElementById("luzIcon");
    const luzText = document.getElementById("luzText");
    const soilHumidityEl = document.getElementById("soilHumidityValue");

    // ---- IndexedDB: almacenar histórico de sensores ----
    const DB_NAME = "InvernaderoDB";
    const DB_VERSION = 1;
    const STORE_NAME = "lecturas";
    let db = null;

    function openDB() {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const store = e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        store.createIndex("topic", "topic", { unique: false });
        store.createIndex("timestamp", "timestamp", { unique: false });
      };
      request.onsuccess = (e) => { db = e.target.result; };
      request.onerror = (e) => console.error("IndexedDB error:", e);
    }

    function saveReading(topic, value) {
      if (!db) return;
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).add({ topic, value, timestamp: Date.now() });
    }

    function getReadings(topic, limit = 50) {
      return new Promise((resolve) => {
        if (!db) { resolve([]); return; }
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const index = store.index("timestamp");
        const range = IDBKeyRange.lowerBound(0);
        const results = [];
        index.openCursor(range, "prev").onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.value.topic === topic) results.push(cursor.value);
            cursor.continue();
          } else {
            resolve(results.slice(0, limit).reverse());
          }
        };
      });
    }

    // ---- Gráfica con Chart.js ----
    let sensorChart = null;

    async function updateChart() {
      const humData = await getReadings("invernadero/humedad_amb");
      const tempData = await getReadings("invernadero/temperatura");
      const soilData = await getReadings("invernadero/humedad_suelo");

      if (humData.length === 0 && tempData.length === 0 && soilData.length === 0) return;

      const labels = (humData.length > 0 ? humData : tempData.length > 0 ? tempData : soilData).map(d => {
        const t = new Date(d.timestamp);
        return t.getHours().toString().padStart(2, "0") + ":" + t.getMinutes().toString().padStart(2, "0");
      });

      const humValues = humData.map(d => parseFloat(d.value));
      const tempValues = tempData.map(d => parseFloat(d.value));
      const soilValues = soilData.map(d => parseFloat(d.value));

      const ctx = document.getElementById("sensorChart").getContext("2d");

      if (sensorChart) { sensorChart.destroy(); }

      sensorChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Humedad (%)",
              data: humValues,
              borderColor: "#0ea5e9",
              backgroundColor: "rgba(14, 165, 233, 0.1)",
              tension: 0.3,
              fill: true,
              pointRadius: 3,
            },
              {
                label: "Temperatura (°C)",
                data: tempValues,
                borderColor: "#f59e0b",
                backgroundColor: "rgba(245, 158, 11, 0.1)",
                tension: 0.3,
                fill: true,
                pointRadius: 3,
                yAxisID: "y1",
              },
              {
                label: "Humedad Suelo (%)",
                data: soilValues,
                borderColor: "#22c55e",
                backgroundColor: "rgba(34, 197, 94, 0.1)",
                tension: 0.3,
                fill: true,
                pointRadius: 3,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: {
                labels: { color: "#94a3b8", font: { family: "Inter" } }
              }
            },
            scales: {
              x: {
                ticks: { color: "#94a3b8", maxTicksLimit: 10 },
                grid: { color: "rgba(255,255,255,0.05)" }
              },
              y: {
                beginAtZero: true,
                ticks: { color: "#94a3b8" },
                grid: { color: "rgba(255,255,255,0.05)" },
                title: { display: true, text: "Humedad (%)", color: "#94a3b8" }
              },
              y1: {
                position: "right",
                beginAtZero: true,
                ticks: { color: "#94a3b8" },
                grid: { drawOnChartArea: false },
                title: { display: true, text: "Temperatura (°C)", color: "#94a3b8" }
              },

            }
          }
      });
    }

    // --- Procesar datos de sensores (usado por MQTT real y simulador) ---
    function procesarDato(topic, raw) {
      let payload = raw;
      try {
        const j = JSON.parse(raw);
        if (typeof j === "object" && j !== null) payload = String(j.value ?? Object.values(j)[0]);
      } catch (_) {}
      console.log(`[${topic}] ${raw} → ${payload}`);

      switch (topic) {
        case "invernadero/humedad_amb":
          humidityEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">%</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
        case "invernadero/temperatura":
          temperatureEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">°C</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
        case "invernadero/ventilador":
          updateMotorUI(ventIcon, ventText, payload);
          break;
        case "invernadero/bomba":
          updateMotorUI(sumpIcon, sumpText, payload);
          break;
        case "invernadero/bombilla":
          updateLuzUI(payload);
          saveReading(topic, payload);
          break;
        case "invernadero/humedad_suelo":
          soilHumidityEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">%</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
      }
    }

    function injectData(topic, payload) {
      procesarDato(topic, payload);
    }

    function simularDatos() {
      const hora = new Date().getHours();
      const esDiurno = hora >= 6 && hora < 20;
      const temp = (20 + Math.random() * 10).toFixed(1);
      const hum = (55 + Math.random() * 30).toFixed(1);
      const luz = esDiurno ? "1" : "0";
      const vent = Math.random() > 0.5 ? "ON" : "OFF";
      const bomba = Math.random() > 0.7 ? "ON" : "OFF";
      injectData("invernadero/humedad_amb", hum);
      injectData("invernadero/temperatura", temp);
      injectData("invernadero/bombilla", luz);
      injectData("invernadero/humedad_suelo", (40 + Math.random() * 40).toFixed(1));
      injectData("invernadero/ventilador", vent);
      injectData("invernadero/bomba", bomba);
    }

    // ---- Cliente MQTT (con fallback si Paho no cargó) ----
    let client = null;
    try {
      if (typeof Paho !== "undefined") {
        client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);

        client.onConnectionLost = (response) => {
          updateConnectionStatus(false);
          setTimeout(() => { connectToBroker(); }, 3000);
        };

        client.onMessageArrived = (message) => {
          procesarDato(message.destinationName, message.payloadString);
        };
      }
    } catch (e) {
      console.warn("Paho MQTT no disponible, solo funcionará el simulador:", e);
    }

    function connectToBroker() {
      if (!client) return;
      updateConnectionStatus(false);
      connText.textContent = "Conectando...";
      connDot.className = "dot disconnected";

      client.connect({
        onSuccess: () => {
          updateConnectionStatus(true);
          TOPICS.forEach(t => client.subscribe(t));
        },
        onFailure: () => {
          updateConnectionStatus(false);
          setTimeout(connectToBroker, 5000);
        },
        useSSL: true,
        path: "/mqtt",
        userName: MQTT_USER,
        password: MQTT_PASS,
        timeout: 10,
        keepAliveInterval: 30
      });
    }

    // ---- Actualizar indicador de conexión ----
    function updateConnectionStatus(connected) {
      if (connected) {
        connDot.className = "dot connected";
        connText.textContent = "Conectado";
      } else {
        connDot.className = "dot disconnected";
        connText.textContent = "Desconectado";
      }
    }

    // ---- Actualizar UI de motores ----
    function updateMotorUI(iconEl, textEl, state) {
      const isOn = state.toUpperCase() === "ON";
      iconEl.style.color = isOn ? "var(--green)" : "var(--red)";
      textEl.textContent = isOn ? "Activado" : "Desactivado";
      textEl.className = "state-text " + (isOn ? "on" : "off");
    }

    // ---- Actualizar UI de luminosidad ----
    function updateLuzUI(value) {
      const esDia = value === "1";
      luzIcon.className = esDia ? "fas fa-sun" : "fas fa-moon";
      luzIcon.style.color = esDia ? "#f59e0b" : "#6366f1";
      luzText.textContent = esDia ? "Día" : "Noche";
      luzText.className = "state-text " + (esDia ? "on" : "off");
    }

    // ---- Iniciar conexión ----
    openDB();
    connectToBroker();
  </script>
</body>
</html>
