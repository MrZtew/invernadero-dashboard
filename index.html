<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor MQTT - Riego y Ventilación</title>
  <!-- Librería Paho MQTT vía CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/paho-mqtt.min.js"></script>
  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    /* ---- Reset y variables ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(255,255,255,0.06);
      --card-border: rgba(255,255,255,0.1);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #3b82f6;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    html { font-family: 'Inter', sans-serif; color: var(--text-primary); }
    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ---- Contenedor principal ---- */
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header h1 i { color: var(--accent); margin-right: 8px; }
    .header-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    /* ---- Indicador de conexión ---- */
    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      transition: background 0.3s;
    }
    .connection-status .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .connection-status .dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .connection-status .dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    /* ---- Botón de ajustes ---- */
    .settings-toggle {
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
    }
    .settings-toggle:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
    .settings-toggle.active { background: var(--accent); color: #fff; }

    /* ---- Panel de ajustes ---- */
    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel h3 {
      font-size: 1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-panel h3 i { color: var(--accent); }
    .settings-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 500px) {
      .settings-group { grid-template-columns: 1fr; }
    }
    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .settings-field label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }
    .settings-field input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }
    .settings-field input:focus { outline: none; border-color: var(--accent); }
    .settings-topics {
      margin-bottom: 16px;
    }
    .settings-topics .topic-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .settings-topics .topic-row input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
    }
    .settings-topics .topic-row input:focus { outline: none; border-color: var(--accent); }
    .settings-topics .topic-del {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
    }
    .settings-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .settings-actions button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .settings-actions .btn-save {
      background: var(--accent);
      color: #fff;
    }
    .settings-actions .btn-save:hover { background: #2563eb; }
    .settings-actions .btn-add-topic {
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
    }
    .settings-actions .btn-add-topic:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }

    /* ---- Botón de simulación ---- */
    .sim-toggle {
      padding: 8px 20px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .sim-toggle:active { transform: scale(0.96); }
    .sim-toggle.off { background: #334155; color: #94a3b8; }
    .sim-toggle.on { background: var(--accent); color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.5); }

    /* ---- Grid de tarjetas ---- */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
    }

    /* ---- Tarjeta (card) ---- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }
    .card .label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card .value {
      font-size: 2.4rem;
      font-weight: 700;
    }
    .card .value .unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    /* ---- Estado de motores ---- */
    .motor-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .motor-status i {
      font-size: 2rem;
      transition: color 0.3s;
    }
    .motor-status .state-text {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .motor-status .state-text.on { color: var(--green); }
    .motor-status .state-text.off { color: var(--red); }

    /* ---- Sección de gráfica ---- */
    .chart-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      margin-top: 20px;
    }
    .chart-section h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-section h2 i { color: var(--accent); }
    .csv-btn {
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .csv-btn:hover { background: rgba(59,130,246,0.15); }
    .csv-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .csv-dates { display:flex;gap:10px;flex-wrap:wrap; }
    .csv-dates label {
      display:flex;align-items:center;gap:4px;
      font-size:0.8rem;color:var(--text-secondary);
    }
    .csv-dates input {
      background: rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:6px;
      padding:4px 8px;
      color:var(--text-primary);
      font-family:inherit;
      font-size:0.8rem;
    }
    .csv-dates input:focus { outline:none;border-color:var(--accent); }
    .csv-topics { display:flex;flex-wrap:wrap;gap:6px; }
    .csv-topics label {
      display:flex;align-items:center;gap:3px;
      font-size:0.75rem;color:var(--text-secondary);
      cursor:pointer;
      padding:3px 8px;
      border-radius:6px;
      background: rgba(255,255,255,0.04);
      transition:background 0.2s;
      user-select:none;
    }
    .csv-topics label:hover { background: rgba(255,255,255,0.08); }
    .csv-topics input { accent-color:var(--accent); }
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-height: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1><i class="fas fa-microchip"></i>Monitor de Riego</h1>
      <div class="header-controls">
        <div class="connection-status" id="connectionStatus">
          <span class="dot disconnected" id="connectionDot"></span>
          <span id="connectionText">Desconectado</span>
        </div>
        <button class="sim-toggle off" id="simBtn"><i class="fas fa-play"></i> Simular ESP</button>
        <button class="settings-toggle" id="settingsToggle"><i class="fas fa-cog"></i> Ajustes</button>
      </div>
    </header>

    <!-- Panel de ajustes -->
    <div class="settings-panel" id="settingsPanel">
      <h3><i class="fas fa-sliders-h"></i>Configuración de conexión</h3>
      <div class="settings-group">
        <div class="settings-field">
          <label>Host MQTT</label>
          <input id="cfgHost" placeholder="ej: a1b2c3.s1.eu.hivemq.cloud">
        </div>
        <div class="settings-field">
          <label>Puerto (SSL)</label>
          <input id="cfgPort" placeholder="8884">
        </div>
        <div class="settings-field">
          <label>Usuario</label>
          <input id="cfgUser" placeholder="Usuario MQTT">
        </div>
        <div class="settings-field">
          <label>Contraseña</label>
          <input id="cfgPass" type="password" placeholder="Contraseña">
        </div>
      </div>
      <div class="settings-topics" id="settingsTopics">
        <label style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);display:block;margin-bottom:8px;">Tópicos</label>
      </div>
      <div class="settings-actions">
        <button class="btn-add-topic" id="addTopicBtn"><i class="fas fa-plus"></i> Añadir tópico</button>
        <button class="btn-save" id="saveSettingsBtn"><i class="fas fa-save"></i> Guardar y reconectar</button>
      </div>
    </div>

    <!-- Grid de tarjetas -->
    <div class="cards-grid">
      <!-- Humedad -->
      <div class="card">
        <div class="label"><i class="fas fa-tint"></i>Humedad</div>
        <div class="value" id="humidityValue">--<span class="unit">%</span></div>
      </div>

      <!-- Humedad de suelo -->
      <div class="card">
        <div class="label"><i class="fas fa-seedling"></i>Humedad de Suelo</div>
        <div class="value" id="soilHumidityValue">--<span class="unit">%</span></div>
      </div>

      <!-- Temperatura -->
      <div class="card">
        <div class="label"><i class="fas fa-thermometer-half"></i>Temperatura</div>
        <div class="value" id="temperatureValue">--<span class="unit">°C</span></div>
      </div>

      <!-- Luminosidad (LDR) -->
      <div class="card">
        <div class="label"><i class="fas fa-sun"></i>Luminosidad</div>
        <div class="motor-status">
          <i class="fas fa-sun" id="luzIcon" style="color: #f59e0b;"></i>
          <span class="state-text" id="luzText">---</span>
        </div>
      </div>

      <!-- Motor de ventilación -->
      <div class="card">
        <div class="label"><i class="fas fa-fan"></i>Motor de Ventilación</div>
        <div class="motor-status">
          <i class="fas fa-fan" id="ventIcon" style="color: var(--red);"></i>
          <span class="state-text off" id="ventText">Desactivado</span>
        </div>
      </div>

      <!-- Motor sumergido (bomba de agua) -->
      <div class="card">
        <div class="label"><i class="fas fa-water"></i>Motor Sumergido</div>
        <div class="motor-status">
          <i class="fas fa-water" id="sumpIcon" style="color: var(--red);"></i>
          <span class="state-text off" id="sumpText">Desactivado</span>
        </div>
      </div>

    </div>

    <!-- Sección de gráfica histórica -->
    <div class="chart-section">
      <h2 style="margin:0 0 12px 0;"><i class="fas fa-chart-line"></i>Histórico de Sensores</h2>

      <!-- Filtros y exportación -->
      <div class="csv-filters">
        <div class="csv-dates">
          <label>Desde: <input type="date" id="csvFrom"></label>
          <label>Hasta: <input type="date" id="csvTo"></label>
        </div>
        <div class="csv-topics" id="csvTopics"></div>
        <button id="csvBtn" class="csv-btn"><i class="fas fa-download"></i> Descargar CSV</button>
      </div>

      <div class="chart-wrapper">
        <canvas id="sensorChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // ---- Simulador (se registra primero, no depende de nada) ----
    let simInterval = null;
    document.getElementById("simBtn").addEventListener("click", () => {
      const btn = document.getElementById("simBtn");
      if (simInterval) {
        clearInterval(simInterval);
        simInterval = null;
        btn.className = "sim-toggle off";
        btn.innerHTML = '<i class="fas fa-play"></i> Simular ESP';
      } else {
        simularDatos();
        simInterval = setInterval(simularDatos, 3000);
        btn.className = "sim-toggle on";
        btn.innerHTML = '<i class="fas fa-stop"></i> Detener simulación';
      }
    });

    // ---- Configuración persistente (localStorage) ----
    const STORAGE_KEY = "invernadero_cfg";
    const CLIENT_ID = "web_dashboard_" + Math.random().toString(36).substring(2, 10);

    const DEFAULTS = {
      host: "aadfec39d82e4788bfbebcbf3bfde060.s1.eu.hivemq.cloud",
      port: "8884",
      user: "INVERNADERO_WEB",
      pass: "Invernadero123*",
      topics: [
        "invernadero/humedad_amb",
        "invernadero/temperatura",
        "invernadero/ventilador",
        "invernadero/bomba",
        "invernadero/bombilla",
        "invernadero/humedad_suelo"
      ]
    };

    function loadCfg() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...DEFAULTS, ...JSON.parse(raw) } : { ...DEFAULTS };
      } catch { return { ...DEFAULTS }; }
    }

    function saveCfg(cfg) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
    }

    let CFG = loadCfg();
    let MQTT_HOST = CFG.host;
    let MQTT_PORT = parseInt(CFG.port);
    let MQTT_USER = CFG.user;
    let MQTT_PASS = CFG.pass;
    let TOPICS = [...CFG.topics];

    // ---- Elementos del DOM ----
    const connDot = document.getElementById("connectionDot");
    const connText = document.getElementById("connectionText");
    const humidityEl = document.getElementById("humidityValue");
    const temperatureEl = document.getElementById("temperatureValue");
    const ventIcon = document.getElementById("ventIcon");
    const ventText = document.getElementById("ventText");
    const sumpIcon = document.getElementById("sumpIcon");
    const sumpText = document.getElementById("sumpText");
    const luzIcon = document.getElementById("luzIcon");
    const luzText = document.getElementById("luzText");
    const soilHumidityEl = document.getElementById("soilHumidityValue");

    // ---- IndexedDB: almacenar histórico de sensores ----
    const DB_NAME = "InvernaderoDB";
    const DB_VERSION = 1;
    const STORE_NAME = "lecturas";
    let db = null;

    function openDB() {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const store = e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        store.createIndex("topic", "topic", { unique: false });
        store.createIndex("timestamp", "timestamp", { unique: false });
      };
      request.onsuccess = (e) => { db = e.target.result; };
      request.onerror = (e) => console.error("IndexedDB error:", e);
    }

    function saveReading(topic, value) {
      if (!db) return;
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).add({ topic, value, timestamp: Date.now() });
    }

    function getReadings(topic, limit = 50) {
      return new Promise((resolve) => {
        if (!db) { resolve([]); return; }
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const index = store.index("timestamp");
        const range = IDBKeyRange.lowerBound(0);
        const results = [];
        index.openCursor(range, "prev").onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.value.topic === topic) results.push(cursor.value);
            cursor.continue();
          } else {
            resolve(results.slice(0, limit).reverse());
          }
        };
      });
    }

    // ---- Gráfica con Chart.js ----
    let sensorChart = null;

    async function updateChart() {
      const humTopic = TOPICS.find(t => t.endsWith("humedad_amb")) || "invernadero/humedad_amb";
      const tempTopic = TOPICS.find(t => t.endsWith("temperatura")) || "invernadero/temperatura";
      const soilTopic = TOPICS.find(t => t.endsWith("humedad_suelo")) || "invernadero/humedad_suelo";
      const humData = await getReadings(humTopic);
      const tempData = await getReadings(tempTopic);
      const soilData = await getReadings(soilTopic);

      if (humData.length === 0 && tempData.length === 0 && soilData.length === 0) return;

      const labels = (humData.length > 0 ? humData : tempData.length > 0 ? tempData : soilData).map(d => {
        const t = new Date(d.timestamp);
        return t.getHours().toString().padStart(2, "0") + ":" + t.getMinutes().toString().padStart(2, "0");
      });

      const humValues = humData.map(d => parseFloat(d.value));
      const tempValues = tempData.map(d => parseFloat(d.value));
      const soilValues = soilData.map(d => parseFloat(d.value));

      const ctx = document.getElementById("sensorChart").getContext("2d");

      if (sensorChart) { sensorChart.destroy(); }

      sensorChart = new Chart(ctx, {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "Humedad (%)",
              data: humValues,
              borderColor: "#0ea5e9",
              backgroundColor: "rgba(14, 165, 233, 0.1)",
              tension: 0.3,
              fill: true,
              pointRadius: 3,
            },
              {
                label: "Temperatura (°C)",
                data: tempValues,
                borderColor: "#f59e0b",
                backgroundColor: "rgba(245, 158, 11, 0.1)",
                tension: 0.3,
                fill: true,
                pointRadius: 3,
                yAxisID: "y1",
              },
              {
                label: "Humedad Suelo (%)",
                data: soilValues,
                borderColor: "#22c55e",
                backgroundColor: "rgba(34, 197, 94, 0.1)",
                tension: 0.3,
                fill: true,
                pointRadius: 3,
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: {
                labels: { color: "#94a3b8", font: { family: "Inter" } }
              }
            },
            scales: {
              x: {
                ticks: { color: "#94a3b8", maxTicksLimit: 10 },
                grid: { color: "rgba(255,255,255,0.05)" }
              },
              y: {
                beginAtZero: true,
                ticks: { color: "#94a3b8" },
                grid: { color: "rgba(255,255,255,0.05)" },
                title: { display: true, text: "Humedad (%)", color: "#94a3b8" }
              },
              y1: {
                position: "right",
                beginAtZero: true,
                ticks: { color: "#94a3b8" },
                grid: { drawOnChartArea: false },
                title: { display: true, text: "Temperatura (°C)", color: "#94a3b8" }
              },

            }
          }
      });
    }

    // --- Procesar datos de sensores (usado por MQTT real y simulador) ---
    function procesarDato(topic, raw) {
      let payload = raw;
      try {
        const j = JSON.parse(raw);
        if (typeof j === "object" && j !== null) payload = String(j.value ?? Object.values(j)[0]);
      } catch (_) {}
      console.log(`[${topic}] ${raw} → ${payload}`);

      const key = topic.split("/").pop();
      switch (key) {
        case "temperatura":
          temperatureEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">°C</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
        case "humedad_amb":
          humidityEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">%</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
        case "humedad_suelo":
          soilHumidityEl.innerHTML = `${parseFloat(payload).toFixed(1)}<span class="unit">%</span>`;
          saveReading(topic, payload);
          updateChart();
          break;
        case "bombilla":
          updateLuzUI(payload);
          saveReading(topic, payload);
          break;
        case "ventilador":
          updateMotorUI(ventIcon, ventText, payload);
          break;
        case "bomba":
          updateMotorUI(sumpIcon, sumpText, payload);
          break;
      }
    }

    function injectData(topic, payload) {
      procesarDato(topic, payload);
    }

    function simularDatos() {
      const ahora = new Date();
      const esDiurno = ahora.getHours() >= 6 && ahora.getHours() < 20;
      const temp = (20 + Math.random() * 10).toFixed(1);
      const hum = (55 + Math.random() * 30).toFixed(1);
      const luz = esDiurno ? "1" : "0";
      const vent = Math.random() > 0.5 ? "ON" : "OFF";
      const bomba = Math.random() > 0.7 ? "ON" : "OFF";
      const t = (suf) => TOPICS.find(t => t.endsWith(suf)) || "invernadero/" + suf;
      injectData(t("humedad_amb"), hum);
      injectData(t("temperatura"), temp);
      injectData(t("bombilla"), luz);
      injectData(t("humedad_suelo"), (40 + Math.random() * 40).toFixed(1));
      injectData(t("ventilador"), vent);
      injectData(t("bomba"), bomba);
    }

    // ---- Cliente MQTT (con fallback si Paho no cargó) ----
    let client = null;
    try {
      if (typeof Paho !== "undefined") {
        client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);

        client.onConnectionLost = (response) => {
          updateConnectionStatus(false);
          setTimeout(() => { connectToBroker(); }, 3000);
        };

        client.onMessageArrived = (message) => {
          procesarDato(message.destinationName, message.payloadString);
        };
      }
    } catch (e) {
      console.warn("Paho MQTT no disponible, solo funcionará el simulador:", e);
    }

    function connectToBroker() {
      if (!client) return;
      updateConnectionStatus(false);
      connText.textContent = "Conectando...";
      connDot.className = "dot disconnected";

      client.connect({
        onSuccess: () => {
          updateConnectionStatus(true);
          TOPICS.forEach(t => client.subscribe(t));
        },
        onFailure: () => {
          updateConnectionStatus(false);
          setTimeout(connectToBroker, 5000);
        },
        useSSL: true,
        path: "/mqtt",
        userName: MQTT_USER,
        password: MQTT_PASS,
        timeout: 10,
        keepAliveInterval: 30
      });
    }

    // ---- Actualizar indicador de conexión ----
    function updateConnectionStatus(connected) {
      if (connected) {
        connDot.className = "dot connected";
        connText.textContent = "Conectado";
      } else {
        connDot.className = "dot disconnected";
        connText.textContent = "Desconectado";
      }
    }

    // ---- Actualizar UI de motores ----
    function updateMotorUI(iconEl, textEl, state) {
      const isOn = state.toUpperCase() === "ON";
      iconEl.style.color = isOn ? "var(--green)" : "var(--red)";
      textEl.textContent = isOn ? "Activado" : "Desactivado";
      textEl.className = "state-text " + (isOn ? "on" : "off");
    }

    // ---- Actualizar UI de luminosidad ----
    function updateLuzUI(value) {
      const esDia = value === "1";
      luzIcon.className = esDia ? "fas fa-sun" : "fas fa-moon";
      luzIcon.style.color = esDia ? "#f59e0b" : "#6366f1";
      luzText.textContent = esDia ? "Día" : "Noche";
      luzText.className = "state-text " + (esDia ? "on" : "off");
    }

    // ---- Filtros de CSV: inicializar checkboxes de tópicos y fechas ----
    (function initCSVFilters() {
      const container = document.getElementById("csvTopics");
      TOPICS.forEach(t => {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.value = t;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(t.split("/").pop()));
        container.appendChild(label);
      });
      const hoy = new Date();
      document.getElementById("csvFrom").value = new Date(hoy.getTime() - 7*86400000).toISOString().slice(0,10);
      document.getElementById("csvTo").value = hoy.toISOString().slice(0,10);
    })();

    // ---- Exportar CSV con filtros ----
    document.getElementById("csvBtn").addEventListener("click", async () => {
      if (!db) { alert("Base de datos no lista."); return; }

      const desde = new Date(document.getElementById("csvFrom").value);
      const hasta = new Date(document.getElementById("csvTo").value + "T23:59:59");
      const topicsSel = [...document.querySelectorAll("#csvTopics input:checked")].map(cb => cb.value);
      if (topicsSel.length === 0) { alert("Selecciona al menos un tópico."); return; }

      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const index = store.index("timestamp");
      const range = IDBKeyRange.bound(desde.getTime(), hasta.getTime());
      const all = [];

      await new Promise((resolve) => {
        index.openCursor(range).onsuccess = (e) => {
          const c = e.target.result;
          if (c) {
            if (topicsSel.includes(c.value.topic)) all.push(c.value);
            c.continue();
          } else resolve();
        };
      });

      if (all.length === 0) { alert("No hay datos en ese rango."); return; }

      const header = "timestamp;fecha;topico;valor";
      const rows = all.map(r => {
        const t = new Date(r.timestamp);
        const fecha = t.toLocaleString("es-ES");
        return `${r.timestamp};${fecha};${r.topic};${r.value}`;
      });
      const bom = "\uFEFF";
      const blob = new Blob([bom + header + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `invernadero_${document.getElementById("csvFrom").value}_${document.getElementById("csvTo").value}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // ---- Panel de ajustes ----
    const settingsToggle = document.getElementById("settingsToggle");
    const settingsPanel = document.getElementById("settingsPanel");
    settingsToggle.addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
      settingsToggle.classList.toggle("active");
      if (settingsPanel.classList.contains("open")) {
        renderSettingsForm();
      }
    });

    function renderSettingsForm() {
      const cfg = loadCfg();
      document.getElementById("cfgHost").value = cfg.host;
      document.getElementById("cfgPort").value = cfg.port;
      document.getElementById("cfgUser").value = cfg.user;
      document.getElementById("cfgPass").value = cfg.pass;
      renderTopicInputs(cfg.topics);
    }

    function renderTopicInputs(topics) {
      const container = document.getElementById("settingsTopics");
      const label = container.querySelector("label");
      container.innerHTML = "";
      if (label) container.appendChild(label);
      topics.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "topic-row";
        const input = document.createElement("input");
        input.value = t;
        input.dataset.index = i;
        input.placeholder = "invernadero/topico";
        const delBtn = document.createElement("button");
        delBtn.className = "topic-del";
        delBtn.innerHTML = '<i class="fas fa-times"></i>';
        delBtn.addEventListener("click", () => {
          const inputs = container.querySelectorAll(".topic-row input");
          if (inputs.length <= 1) return;
          row.remove();
        });
        row.appendChild(input);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    document.getElementById("addTopicBtn").addEventListener("click", () => {
      const container = document.getElementById("settingsTopics");
      const row = document.createElement("div");
      row.className = "topic-row";
      const input = document.createElement("input");
      input.value = "";
      input.placeholder = "invernadero/nuevo_topico";
      const delBtn = document.createElement("button");
      delBtn.className = "topic-del";
      delBtn.innerHTML = '<i class="fas fa-times"></i>';
      delBtn.addEventListener("click", () => {
        const inputs = container.querySelectorAll(".topic-row input");
        if (inputs.length <= 1) return;
        row.remove();
      });
      row.appendChild(input);
      row.appendChild(delBtn);
      container.appendChild(row);
      input.focus();
    });

    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const topics = [...document.querySelectorAll("#settingsTopics .topic-row input")]
        .map(i => i.value.trim())
        .filter(Boolean);
      if (topics.length === 0) { alert("Debe haber al menos un tópico."); return; }

      const newCfg = {
        host: document.getElementById("cfgHost").value.trim(),
        port: document.getElementById("cfgPort").value.trim(),
        user: document.getElementById("cfgUser").value.trim(),
        pass: document.getElementById("cfgPass").value,
        topics
      };
      if (!newCfg.host) { alert("El host es obligatorio."); return; }
      if (!newCfg.port) { alert("El puerto es obligatorio."); return; }

      saveCfg(newCfg);
      CFG = newCfg;
      MQTT_HOST = newCfg.host;
      MQTT_PORT = parseInt(newCfg.port);
      MQTT_USER = newCfg.user;
      MQTT_PASS = newCfg.pass;
      TOPICS = [...newCfg.topics];

      // Reconstruir checkboxes de CSV
      const csvContainer = document.getElementById("csvTopics");
      csvContainer.innerHTML = "";
      TOPICS.forEach(t => {
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = true;
        cb.value = t;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(t.split("/").pop()));
        csvContainer.appendChild(label);
      });

      // Reconectar MQTT
      if (client) {
        try { client.disconnect(); } catch (_) {}
      }
      try {
        if (typeof Paho !== "undefined") {
          client = new Paho.MQTT.Client(MQTT_HOST, MQTT_PORT, CLIENT_ID);
          client.onConnectionLost = (response) => {
            updateConnectionStatus(false);
            setTimeout(() => { connectToBroker(); }, 3000);
          };
          client.onMessageArrived = (message) => {
            procesarDato(message.destinationName, message.payloadString);
          };
        }
      } catch (e) {
        console.warn("Paho MQTT no disponible:", e);
      }
      connectToBroker();

      settingsPanel.classList.remove("open");
      settingsToggle.classList.remove("active");
    });

    // ---- Iniciar conexión ----
    openDB();
    connectToBroker();
  </script>
</body>
</html>
